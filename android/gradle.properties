# Gradle JVM - keep heap modest to avoid native OOM on Windows (see hs_err_*.log)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.daemon=true

# Pub cache is on C: while some dev clones live on D: - incremental Kotlin breaks across drives.
kotlin.incremental=false

android.useAndroidX=true
