name: Bug Report
description: Report a bug or reliability issue
title: "[Bug]: "
labels: ["bug", "needs testing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nomad Alarm. Please avoid sharing exact home addresses or personal locations in public reports.

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: android
    attributes:
      label: Android Version
      options:
        - Android 14
        - Android 13
        - Android 12
        - Android 11
        - Android 10
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: "e.g. Samsung Galaxy S23"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Create alarm for ...
        2. Start tracking
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: alarm-active
    attributes:
      label: Was an alarm actively tracking?
      options:
        - "Yes - background / screen off"
        - "Yes - foreground only"
        - "No"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before filing
          required: true
