name: Question
description: Ask a question about Nomad Alarm
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For quick questions, consider [GitHub Discussions](https://github.com/ProgrammerNomad/Nomad-Alarm/discussions) first.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Development / contributing
        - Architecture / documentation
        - Usage / how-to
        - Permissions / Android
        - Maps / search / APIs
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Docs you've read, app version, what you've tried
      placeholder: "I read docs/SETUP.md and ..."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the documentation in docs/
          required: true
