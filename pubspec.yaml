name: nomad_alarm
description: A privacy-first location alarm that wakes you before reaching your destination.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon/icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icons/app_icon/foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/icons/app_icon/
