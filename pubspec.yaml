name: nomad_alarm
description: A privacy-first location alarm that wakes you before reaching your destination.
publish_to: 'none'
version: 3.1.1+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.1.0
  flutter_tts: ^4.2.0
  vibration: ^3.1.3
  torch_light: ^1.1.0
  battery_plus: ^6.2.1
  package_info_plus: ^8.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  home_widget: ^0.7.0
  app_links: ^6.3.3
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.10.0
  flutter_map_tile_caching: ^9.1.4
  audioplayers: ^6.1.0
  open_location_code: ^1.0.0
  speech_to_text: ^7.0.0
  apple_maps_flutter: ^1.3.0

dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon/icon.png
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icons/app_icon/foreground.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/icons/app_icon/
